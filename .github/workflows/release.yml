name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Secrets no se pueden leer en `if:`; se exponen via env de job.
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Sign portable EXE (Ed25519)
        if: env.SIGNING_KEY != ''
        shell: bash
        run: cargo run --release --bin sign-release -- target/release/zendesktop.exe

      - name: Collect portable artifacts
        shell: bash
        run: |
          mkdir -p release
          V="${{ steps.version.outputs.VERSION }}"
          cp target/release/zendesktop.exe "release/ZenDesktop-v${V}.exe"
          cp target/release/zendesktop.exe release/ZenDesktop.exe
          if [ -f target/release/zendesktop.exe.sig ]; then
            cp target/release/zendesktop.exe.sig release/ZenDesktop.exe.sig
          fi
          cp LICENSE release/
          cp README.md release/
          cp CHANGELOG.md release/
          cd release
          powershell -Command "Compress-Archive -Path ZenDesktop.exe,LICENSE,README.md,CHANGELOG.md -DestinationPath ZenDesktop-v${V}-portable.zip"

      - name: Install WiX v4
        shell: bash
        run: dotnet tool install --global wix --version 5.* 2>/dev/null || echo "WiX already installed"

      - name: Build MSI installer
        shell: bash
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          mkdir -p installer/staging
          cp target/release/zendesktop.exe installer/staging/ZenDesktop.exe
          cp assets/icons/zendesktop.ico installer/staging/zendesktop.ico
          cp LICENSE installer/staging/LICENSE
          cp README.md installer/staging/README.md
          # Paths in the .wxs resolve relative to the .wxs file, so run from
          # installer/ with SrcDir=staging. -arch x64 sets the MSI platform
          # (WiX v5 does not accept a Platform attribute on Package).
          cd installer
          ~/.dotnet/tools/wix build -arch x64 -d Version=${V} -d SrcDir=staging \
            zendesktop.wxs -o "../release/ZenDesktop-v${V}-x64.msi"
          # WiX also emits a debug .wixpdb next to the MSI — not a release asset.
          rm -f "../release/ZenDesktop-v${V}-x64.wixpdb"

      - name: Install Inno Setup
        shell: bash
        run: |
          choco install innosetup -y --no-progress 2>&1 | tail -2 || true
          ls "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" 2>&1 || \
            ls "/c/Program Files (x86)/Inno Setup 5/ISCC.exe" 2>&1

      - name: Build EXE installer (Inno Setup)
        shell: bash
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          mkdir -p installer/staging
          cp target/release/zendesktop.exe installer/staging/ZenDesktop.exe
          cp assets/icons/zendesktop.ico installer/staging/zendesktop.ico
          cp LICENSE installer/staging/LICENSE
          cp README.md installer/staging/README.md
          ISCC=""
          if [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          elif [ -f "/c/Program Files (x86)/Inno Setup 5/ISCC.exe" ]; then
            ISCC="/c/Program Files (x86)/Inno Setup 5/ISCC.exe"
          fi
          if [ -n "$ISCC" ]; then
            cd installer
            # -D en lugar de /D: MSYS convertiria /D... a una ruta de Windows
            "$ISCC" -DMyAppVersion=${V} zendesktop.iss
          else
            echo "Inno Setup not found - skipping EXE installer"
          fi

      - name: Generate SHA256 checksums
        shell: powershell
        run: |
          Get-ChildItem -Path release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ZenDesktop v${{ steps.version.outputs.VERSION }}"
          body_path: CHANGELOG.md
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
