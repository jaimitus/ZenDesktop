<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ZenDesktop · Configuración (vista previa)</title>
<style>
  body { margin: 0; background: #111827; font-family: "Segoe UI", sans-serif; color: #E6EDF7; display: flex; flex-direction: column; align-items: center; padding: 24px; gap: 22px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  p { margin: 0; font-size: 12px; color: #8FA6C4; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .card { text-align: center; }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: #7DD3FC; }
  img { border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.55); border: 1px solid #26324E; max-width: 720px; }
</style>
</head>
<body>
  <h1>Ventana de Configuración — ZenDesktop (Direct2D)</h1>
  <p>Capturas reales (720×700) · navegación por la barra lateral · selector de idioma</p>
  <div class="row">
    <div class="card">
      <h2>General (EN)</h2>
      <img src="settings_probe_general.png" alt="Panel General">
    </div>
    <div class="card">
      <h2>Reglas</h2>
      <img src="settings_probe_rules.png" alt="Panel Reglas">
    </div>
    <div class="card">
      <h2>Apariencia</h2>
      <img src="settings_probe_appearance.png" alt="Panel Apariencia">
    </div>
    <div class="card">
      <h2>General (ES) — selector de idioma</h2>
      <img src="settings_probe_es.png" alt="Panel General en español">
    </div>
    <div class="card">
      <h2>Selector de color (abierto)</h2>
      <img src="settings_probe_picker.png" alt="Selector de color abierto">
    </div>
    <div class="card">
      <h2>Selector de color (arrastrado)</h2>
      <img src="settings_probe_picker2.png" alt="Selector de color tras arrastrar">
    </div>
  </div>
</body>
</html>
