<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>ZenDesktop - iconos</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; margin: 24px; background: #10141f; color: #e6edf7; }
  h1 { font-size: 18px; } h2 { font-size: 14px; color: #8fa6c4; margin-top: 28px; }
  table { border-collapse: collapse; }
  td { text-align: center; padding: 14px 10px; }
  th { text-align: left; padding: 6px 12px; color: #7c8aa0; font-weight: 600; }
  .swatch { display: flex; align-items: center; justify-content: center; padding: 10px; }
  .light { background: #f2f4f8; } .dark { background: #141821; }
  .cap { font-size: 11px; color: #7c8aa0; margin-top: 6px; }
  .ico { width: 64px; height: 64px; }
</style></head><body>
<h1>ZenDesktop &mdash; iconos</h1>
<h2>Variante aplicaci&oacute;n (loseta)</h2>
<div class="swatch light"><img src="png/256.png" width="96" height="96"></div>
<table><tr><th>App</th><td><img src="png/16.png" width="16" height="16" loading="lazy"><div class="cap">16px</div></td><td><img src="png/24.png" width="24" height="24" loading="lazy"><div class="cap">24px</div></td><td><img src="png/32.png" width="32" height="32" loading="lazy"><div class="cap">32px</div></td><td><img src="png/48.png" width="48" height="48" loading="lazy"><div class="cap">48px</div></td><td><img src="png/64.png" width="64" height="64" loading="lazy"><div class="cap">64px</div></td><td><img src="png/128.png" width="96" height="96" loading="lazy"><div class="cap">128px</div></td><td><img src="png/256.png" width="96" height="96" loading="lazy"><div class="cap">256px</div></td><td><img src="png/512.png" width="96" height="96" loading="lazy"><div class="cap">512px</div></td><td><img src="png/1024.png" width="96" height="96" loading="lazy"><div class="cap">1024px</div></td></tr></table>
<h2>Variante bandeja del sistema (transparente)</h2>
<div class="swatch dark"><img src="tray/256.png" width="96" height="96"></div>
<table><tr><th>Bandeja</th><td><img src="tray/16.png" width="16" height="16" loading="lazy"><div class="cap">16px</div></td><td><img src="tray/24.png" width="24" height="24" loading="lazy"><div class="cap">24px</div></td><td><img src="tray/32.png" width="32" height="32" loading="lazy"><div class="cap">32px</div></td><td><img src="tray/48.png" width="48" height="48" loading="lazy"><div class="cap">48px</div></td><td><img src="tray/64.png" width="64" height="64" loading="lazy"><div class="cap">64px</div></td><td><img src="tray/128.png" width="96" height="96" loading="lazy"><div class="cap">128px</div></td><td><img src="tray/256.png" width="96" height="96" loading="lazy"><div class="cap">256px</div></td></tr></table>
</body></html>
